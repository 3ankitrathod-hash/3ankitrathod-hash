name: Notebook Demo Execution

on:
  push:
    paths:
      - "olympic-athlete-analysis/**"
      - "customer-feedback-analysis/**"
      - "employee-wellness-eda/**"
      - ".github/workflows/notebook-demo-check.yml"
  pull_request:
    paths:
      - "olympic-athlete-analysis/**"
      - "customer-feedback-analysis/**"
      - "employee-wellness-eda/**"
      - ".github/workflows/notebook-demo-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-demo-notebooks:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install notebook execution tools
        run: python -m pip install --upgrade pip jupyter nbconvert
      - name: Install Olympic project dependencies
        run: python -m pip install -r olympic-athlete-analysis/requirements.txt
      - name: Install customer feedback project dependencies
        run: python -m pip install -r customer-feedback-analysis/requirements.txt
      - name: Install employee wellness project dependencies
        run: python -m pip install -r employee-wellness-eda/requirements.txt
      - name: Execute Olympic notebook with synthetic demo data
        env:
          PORTFOLIO_DEMO_MODE: "1"
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir=/tmp/notebook-results --output=olympic-demo.ipynb olympic-athlete-analysis/Olympic_Athlete_Analysis_Final.ipynb
      - name: Execute customer feedback notebook with synthetic demo data
        env:
          PORTFOLIO_DEMO_MODE: "1"
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir=/tmp/notebook-results --output=customer-feedback-demo.ipynb customer-feedback-analysis/customer_feedback_analysis.ipynb
      - name: Execute employee wellness notebook with synthetic demo data
        env:
          PORTFOLIO_DEMO_MODE: "1"
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir=/tmp/notebook-results --output=employee-wellness-demo.ipynb employee-wellness-eda/Employee_Wellness_EDA.ipynb
