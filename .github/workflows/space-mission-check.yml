name: Space Mission Demo Check

on:
  push:
    paths:
      - "space-mission-analysis/**"
      - ".github/workflows/space-mission-check.yml"
  pull_request:
    paths:
      - "space-mission-analysis/**"
      - ".github/workflows/space-mission-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: space-mission-analysis
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run analysis on the included synthetic demo CSV
        run: python SpaceProject.py
